<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
    <img src="" alt="">
    <div class="form-container">
        <h1>Đăng ký tài khoản</h1>
        <p class="text1">Đăng ký tài khoản để sử dụng dịch vụ</p>
        <form action="#" id="registerForm" novalidate>
            <div class="row">
                <div class="input-group">
                    <label for="fullname">Họ và tên đệm</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="input-group">
                    <label for="firstname">Tên</label>
                    <input type="text" id="firstname" name="firstname" required>
                </div>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="yourEmail@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="checkbox-container">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">Bạn đồng ý với <a href="#" class="link">chính sách và điều khoản</a></label>
            </div>
            <button type="submit">Đăng ký</button>
            <p>Bạn đã có tài khoản? <a href="../pages/login.html" class="link">Đăng nhập</a></p>
        </form>
    </div>
    <script src="../js/register.js"></script>
</body>
</html>
