<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="form-container">
        <h1>Đăng nhập</h1>
        <br>
        <p>Đăng nhập tài khoản để sử dụng hệ thống quản lý</p>
        <br>
        <br>
        <br>
        <form>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="checkbox-container">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">Nhớ tài khoản</label>
                <a href="#" class="link">Quên mật khẩu</a>
            </div>
            <button type="submit">Đăng nhập</button>

            <p class="new-account">Bạn chưa có tài khoản? <a href="../pages/register.html" class="link"> Đăng ký</a></p>
        </form>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
